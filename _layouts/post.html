---
layout: default
---
<article class="post">
  <div class="wrap">
    <a class="back" href="{{ '/blog/' | relative_url }}">&larr; All posts</a>
    <h1>{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    {{ content }}
  </div>
</article>
