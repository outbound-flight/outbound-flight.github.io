<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != '/' %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&family=Noto+Sans+Devanagari:wght@400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
{% feed_meta %}
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="mark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}#work">Work</a>
      <a href="{{ '/' | relative_url }}#about">My story</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/' | relative_url }}#find">Find me</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>
  <div class="wrap">
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</span>
    <span>Hinglish · Indian philosophy · Psychology · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
  </div>
</footer>

</body>
</html>
